plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.harudle'
version = '0.0.1-SNAPSHOT'
description = 'Harudle backend service'

springBoot {
    mainClass = 'com.harudle.HarudleApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.AMAZON
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.genai:google-genai:1.65.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.33.0'
    implementation 'com.google.firebase:firebase-admin:9.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation platform('software.amazon.awssdk:bom:2.48.0')
    implementation 'software.amazon.awssdk:s3'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.1.0'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.rest-assured:spring-mock-mvc:6.0.1'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-localstack'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('resolveProductionDependencies') {
    group = 'build setup'
    description = 'Downloads the artifacts required to compile and package the production application.'

    def dependencyFiles = files(
        configurations.named('compileClasspath'),
        configurations.named('runtimeClasspath'),
        configurations.named('annotationProcessor')
    )
    inputs.files(dependencyFiles)

    doLast {
        logger.lifecycle("Resolved ${dependencyFiles.files.size()} production dependency artifacts.")
    }
}

tasks.named('test') {
    useJUnitPlatform()

    def contextCacheMaxSize = providers.gradleProperty('testContextCacheMaxSize')
    if (contextCacheMaxSize.present) {
        def cacheSize = contextCacheMaxSize.get()
        if (!cacheSize.isInteger() || cacheSize.toInteger() < 1) {
            throw new GradleException('testContextCacheMaxSize must be a positive integer')
        }
        systemProperty 'spring.test.context.cache.maxSize', cacheSize.toInteger()
    }
}
