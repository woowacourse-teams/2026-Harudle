plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.harudle'
version = '0.0.1-SNAPSHOT'
description = 'Harudle backend service'

springBoot {
    mainClass = 'com.harudle.HarudleApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.AMAZON
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'com.google.genai:google-genai:1.65.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.33.0'
    implementation 'com.google.firebase:firebase-admin:9.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation platform('software.amazon.awssdk:bom:2.48.0')
    implementation 'software.amazon.awssdk:s3'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.1.0'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.rest-assured:spring-mock-mvc:6.0.1'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-localstack'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    maintenance {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    maintenanceTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.maintenance.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.maintenance.output
    }
}

configurations {
    maintenanceImplementation.extendsFrom implementation
    maintenanceRuntimeOnly.extendsFrom runtimeOnly
    maintenanceTestImplementation.extendsFrom testImplementation, maintenanceImplementation
    maintenanceTestRuntimeOnly.extendsFrom testRuntimeOnly, maintenanceRuntimeOnly
}

// This task is explicit: ordinary bootJar, test, and build never compile the conversion tool.
tasks.register('maintenanceJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    description = 'Builds the manually invoked diary conversion tool, separate from the server JAR.'
    mainClass = 'com.harudle.diary.infrastructure.crypto.DiarySourceTextBackfillMain'
    targetJavaVersion = provider { java.targetCompatibility }
    archiveFileName = 'harudle-diary-source-maintenance.jar'
    destinationDirectory = layout.buildDirectory.dir('maintenance')
    classpath = sourceSets.maintenance.runtimeClasspath
}

tasks.register('maintenanceTest', Test) {
    group = 'verification'
    description = 'Runs conversion-tool tests without adding them to ordinary server test or build.'
    testClassesDirs = sourceSets.maintenanceTest.output.classesDirs
    classpath = sourceSets.maintenanceTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

tasks.register('resolveProductionDependencies') {
    group = 'build setup'
    description = 'Downloads the artifacts required to compile and package the production application.'

    def dependencyFiles = files(
        configurations.named('compileClasspath'),
        configurations.named('runtimeClasspath'),
        configurations.named('annotationProcessor')
    )
    inputs.files(dependencyFiles)

    doLast {
        logger.lifecycle("Resolved ${dependencyFiles.files.size()} production dependency artifacts.")
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    def contextCacheMaxSize = providers.gradleProperty('testContextCacheMaxSize')
    if (contextCacheMaxSize.present) {
        def cacheSize = contextCacheMaxSize.get()
        if (!cacheSize.isInteger() || cacheSize.toInteger() < 1) {
            throw new GradleException('testContextCacheMaxSize must be a positive integer')
        }
        systemProperty 'spring.test.context.cache.maxSize', cacheSize.toInteger()
    }

    // 테스트 클래스를 여러 JVM에 나눠 동시에 실행한다. JVM마다 컨텍스트 캐시와 DB 컨테이너를 따로 가진다.
    def parallelForks = providers.gradleProperty('testMaxParallelForks')
    if (parallelForks.present) {
        def forks = parallelForks.get()
        if (!forks.isInteger() || forks.toInteger() < 1) {
            throw new GradleException('testMaxParallelForks must be a positive integer')
        }
        maxParallelForks = forks.toInteger()
    }
}
