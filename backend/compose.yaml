services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-harudle}
      POSTGRES_USER: ${DB_USERNAME:-harudle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-harudle}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-harudle} -d ${DB_NAME:-harudle}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
