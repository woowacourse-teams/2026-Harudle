# Optional worker. Use the backend Docker network; do not publish the port.
services:
  codex-image-worker:
    build: .
    restart: unless-stopped
    init: true
    environment:
      CODEX_IMAGE_WORKER_TOKEN: ${CODEX_IMAGE_WORKER_TOKEN:?Set the same internal token on the backend}
      CODEX_IMAGE_TIMEOUT_MS: ${CODEX_IMAGE_TIMEOUT_MS:-300000}
      CODEX_IMAGE_CONCURRENCY: ${CODEX_IMAGE_CONCURRENCY:-1}
      CODEX_IMAGE_QUEUE_CAPACITY: ${CODEX_IMAGE_QUEUE_CAPACITY:-1}
    volumes:
      - codex-auth:/home/node/.codex
    expose:
      - "8090"
    networks:
      - backend
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  codex-auth:

networks:
  backend:
    external: true
    name: ${HARUDLE_DOCKER_NETWORK:-harudle_app}
