version: 0.2

env:
  shell: bash
  variables:
    DB_PASSWORD: test
    KAKAO_REST_API_KEY: test
    KAKAO_CLIENT_SECRET: test
    JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    HARUDLE_GENERATION_ADAPTERS_ENABLED: "false"

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 24
    commands:
      - set -euo pipefail
      - corepack enable
      - corepack prepare pnpm@11.20.0 --activate
      - chmod +x backend/gradlew

  pre_build:
    commands:
      - set -euo pipefail
      - pnpm --dir frontend install --frozen-lockfile

  build:
    commands:
      - set -euo pipefail
      - docker version
      - ./backend/gradlew -p backend --no-daemon test
      - pnpm --dir frontend/web typecheck
      - pnpm --dir frontend/web lint
      - pnpm --dir frontend/web test --ci --runInBand
