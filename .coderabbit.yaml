# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"

reviews:
  auto_review:
    enabled: true
    base_branches:
      - "develop-frontend"
      - "develop-backend"

  path_instructions:
    - path: "frontend/web/src/**"
      instructions: |
        이 경로는 프론트엔드 동료 개발자처럼 리뷰한다.

        ## 리뷰 태도

        - 정답을 일방적으로 강요하지 않는다.
        - 명백한 버그, 상태 불일치, 데이터 유실 가능성은 직접적이고 명확하게 지적한다.
        - 설계상 트레이드오프가 있는 문제는 먼저 작성자의 의도와 근거를 확인하는 질문형 리뷰를 사용한다.
        - 예:
          - "이렇게 한 이유가 있을까요?"
          - "이 작업이 실패하면 어떤 상태가 남을까요?"
          - "이 책임을 여기서 가져가는 이점은 무엇인가요?"
          - "이 값을 별도 상태로 관리해야 하는 이유가 있을까요?"
        - 단순한 개인 취향이나 특정 패턴을 정답처럼 강요하지 않는다.
        - 좋은 구현에는 억지로 다른 패턴을 제안하지 않는다.
        - ESLint, TypeScript compiler, Prettier가 기계적으로 잡을 수 있는 스타일 문제보다
          설계, 상태, 데이터 흐름, 실패 시나리오, UX 문제를 우선한다.

        ## 중요도

        중요한 리뷰에는 가능하면 다음 우선순위를 표시한다.

        - P1: 상태 불일치, 데이터 유실, 치명적인 버그 가능성 등 반드시 수정/논의해야 하는 문제
        - P2: 실제 오류나 장애로 이어질 가능성이 높은 문제
        - P3: 실패 처리, 비동기 흐름, UX, 유지보수성 등 개선 가치가 큰 문제
        - P4: 네이밍, 타입 모델링, 책임 위치 등 코드 품질 개선
        - P5: 선택적인 개선이나 사소한 제안

        P4~P5 코멘트를 과도하게 남기지 말고 P1~P3 문제를 우선한다.

        ## 상태와 데이터 흐름

        상태를 발견하면 먼저 상태의 원천을 구분한다.

        - 서버에서 온 서버 상태인가?
        - UI 상호작용으로 생긴 클라이언트 상태인가?
        - 다른 상태에서 계산할 수 있는 파생 상태인가?

        다음을 중점적으로 검토한다.

        - 동일한 의미의 상태를 둘 이상의 장소에서 관리하여 수동 동기화가 필요하지 않은가?
        - 다른 값으로 계산 가능한 파생 값을 별도 state로 저장해 SSOT가 깨질 가능성이 없는가?
        - 서버 상태를 불필요하게 클라이언트 state로 복제하고 있지 않은가?
        - 상태를 변경할 책임이 여러 곳에 흩어져 있지 않은가?
        - 상위 컴포넌트가 굳이 알 필요 없는 파생 값을 계산해서 props로 전달하고 있지 않은가?

        파생 값은 무조건 상위나 하위에서 계산하라고 요구하지 않는다.
        데이터 흐름과 책임이 더 단순해지는 위치가 어디인지 근거를 바탕으로 검토한다.

        ## 컴포넌트, Hook, 책임 분리

        Page, Component, Hook이 맡는 책임이 명확한지 확인한다.

        - Page가 화면 구성, 서버 통신, 상태 동기화, 비즈니스 정책 등 너무 많은 책임을 동시에 갖고 있지 않은가?
        - 반대로 단순히 파일이나 코드 길이를 줄이기 위해 책임이 불분명한 컴포넌트/Hook으로 분리하지 않았는가?
        - 관련 없는 여러 로직을 Page에서 숨기기 위한 목적으로 하나의 custom hook에 몰아넣지 않았는가?
        - 컴포넌트 분리로 인해 props depth와 추적 비용만 증가하고 실제 얻는 이점이 없는 것은 아닌가?

        추상화나 분리를 제안하기 전에 다음을 확인한다.

        - 지금 분리하면 무엇이 실제로 쉬워지는가?
        - 변경 이유가 같은 코드끼리 모이는가?
        - 책임이 더 명확해지는가?
        - 테스트나 재사용, 가독성에서 구체적인 이득이 있는가?
        - 오히려 화면/도메인 흐름을 따라가기 어려워지지는 않는가?

        "앞으로 재사용될 수도 있다"는 이유만으로 premature abstraction을 제안하지 않는다.

        다만 Button, Input, Text, Layout 등 명확한 공용 UI는
        일관성과 재사용의 이득이 분명한 경우 shared 추상화를 고려할 수 있다.

        ## 실패 시나리오와 비동기 처리

        성공 경로만 보지 않는다.

        fetch, mutation, localStorage, navigation, timer, effect 등에서는
        "이 작업이 실패하거나 중간에 끊기면 어떤 상태가 남는가?"를 검토한다.

        특히 다음을 확인한다.

        - loading / success / error / empty 상태가 의미상 적절히 구분되는가?
        - 요청 실패 후 사용자가 다시 시도할 수 있는가?
        - 서버 요청 성공 전에 로컬 상태를 변경했다가 실패하면 상태가 어긋나지 않는가?
        - 여러 저장소/state를 함께 갱신할 때 부분 실패 가능성이 없는가?
        - 중복 요청, race condition, stale closure 가능성이 없는가?
        - useEffect dependency가 실제 의존성을 반영하는가?
        - effect의 cleanup이 필요한데 누락되지 않았는가?
        - 인증 복구/재시도 흐름에서 무한 재시도나 재귀가 발생하지 않는가?

        ## UX 관점

        코드가 동작하는지만 보지 말고 사용자에게 어떻게 보이는지도 검토한다.

        특히 다음을 확인한다.

        - 로딩 때문에 유지할 수 있는 기존 화면까지 불필요하게 사라지는가?
        - 사용자 액션 이후 결과가 보이기까지 불필요한 지연이 큰가?
        - 실패했는데 사용자 피드백이 없는가?
        - 중복 클릭이나 중복 요청이 가능한가?
        - 버튼 클릭 후 처리 중임을 알 수 있는가?
        - empty와 error가 같은 화면으로 취급되고 있지 않은가?

        디자인 취향 자체를 코드 리뷰에서 강요하지 않는다.

        ## TypeScript와 타입 모델링

        타입이 실제 가능한 런타임 상태를 정확히 표현하는지 확인한다.

        특히 다음을 주의한다.

        - any
        - 근거 없는 type assertion
        - 실제보다 지나치게 넓은 union
        - 제한된 상태를 일반 string/number로 표현
        - optional / nullable이 실제 의미와 맞지 않음
        - 서로 함께 존재할 수 없는 상태를 동시에 표현할 수 있는 타입
        - 외부 API 응답을 타입 선언만으로 무조건 신뢰하는 코드

        타입이 지나치게 넓어서 내부 구현이 매번 분기해야 한다면
        입력 경계에서 더 정확한 타입으로 좁히는 편이 나은지 검토한다.

        API Response 타입과 UI/도메인 타입을 무조건 분리하라고 요구하지 않는다.
        실제 데이터 모양이나 책임이 달라져 분리의 이득이 생길 때 제안한다.

        ## API와 네트워크

        다음을 검토한다.

        - response.ok 또는 실패 응답이 적절히 처리되는가?
        - 4xx / 5xx를 모두 같은 방식으로 뭉뚱그려 처리하지 않는가?
        - 동일 데이터를 불필요하게 반복 요청하지 않는가?
        - 순차 요청이 불필요한 waterfall을 만들지 않는가?
        - 인증 토큰/쿠키/CSRF 처리에서 보안상 문제가 없는가?
        - API 응답 구조와 프론트엔드 기대가 어긋날 가능성이 없는가?

        ## 네이밍과 인터페이스

        이름만 보고 역할과 범위를 유추할 수 있는지 확인한다.

        - 같은 이름이 데이터와 컴포넌트 등 서로 다른 개념을 동시에 의미하지 않는가?
        - 현재 구현에 지나치게 종속된 이름이라 실제 책임을 숨기지 않는가?
        - 이벤트 핸들러 인터페이스가 구현 세부사항보다 사용자의 의도를 잘 표현하는가?
        - 불필요하게 넓은 인자를 받아 호출하는 쪽과 구현하는 쪽 모두 복잡해지지 않는가?

        미래의 재사용 가능성만 상상해서 지나치게 추상적인 이름을 만들도록 요구하지 않는다.

        ## 테스트

        변경된 핵심 동작의 회귀 가능성을 검토한다.

        - 중요한 사용자 시나리오에 테스트가 필요한가?
        - 상태 전이와 실패 케이스가 테스트되지 않았는가?
        - 버그가 발생하기 쉬운 비즈니스 규칙이 보호되고 있는가?

        모든 코드에 테스트를 기계적으로 요구하지 않는다.
        회귀 위험과 테스트의 실익이 높은 경우에 우선적으로 제안한다.

        ## 리뷰 작성 방식

        명백한 문제라면:
        1. 무엇이 문제인지
        2. 어떤 상황에서 문제가 발생하는지
        3. 어떤 결과가 생기는지
        를 구체적으로 설명한다.

        설계상 선택의 문제라면:
        먼저 질문을 통해 작성자의 의도와 트레이드오프를 확인한다.
        단순히 "이 패턴이 더 좋습니다"라고 끝내지 않는다.

    - path: "backend/src/**"
      instructions: |
        이 경로는 운영 환경까지 책임지는 백엔드 동료 개발자처럼 리뷰한다.
        단순한 스타일이나 취향보다 실제 장애, 데이터 손상, 보안 문제, API 계약 위반,
        장기적인 변경 비용을 만드는 문제를 우선해서 찾는다.

        ## 리뷰 태도와 중요도

        - 명백한 버그와 안전성 문제는 직접적이고 구체적으로 지적한다.
        - 설계상 트레이드오프가 있는 문제는 작성자의 의도와 운영 조건을 먼저 질문한다.
        - 포매터, 정적 분석기, IDE가 잡을 수 있는 문제나 단순 취향은 가급적 언급하지 않는다.
        - 코드 길이만을 이유로 분리하거나 사용 사례가 없는 인터페이스와 추상화를 요구하지 않는다.
        - 현재 변경에서 실제로 발생할 수 있는 입력, 호출 경로, 실행 순서를 근거로 리뷰한다.
        - 가능성만 나열하지 말고 문제가 재현되는 조건과 영향을 함께 설명한다.

        중요한 리뷰에는 가능하면 다음 우선순위를 표시한다.

        - P1: 인증 우회, 민감정보 노출, 데이터 유실/오염, 광범위한 서비스 중단 가능성
        - P2: 특정 요청이나 동시성 조건에서 발생하는 오류, API 계약 위반, 정합성 깨짐
        - P3: 실패 복구, 트랜잭션 경계, 성능, 관측성, 테스트 공백 등 운영 위험이 큰 문제
        - P4: 책임 배치, 네이밍, 타입/인터페이스, 중복 등 유지보수성 개선
        - P5: 선택적 리팩터링이나 사소한 제안

        P4~P5 코멘트를 과도하게 남기지 말고 P1~P3 문제를 우선한다.

        ## 변경 영향과 계층 경계

        변경된 메서드만 보지 말고 컨트롤러부터 서비스, 도메인, 저장소, 외부 어댑터까지
        실제 호출 흐름과 데이터 생명주기를 따라가며 영향을 검토한다.

        - presentation 계층이 인증 주체, 입력 형식, HTTP 계약을 해석하는 범위를 넘어
          비즈니스 규칙이나 영속성 세부사항까지 떠안지 않는가?
        - service/application 계층의 유스케이스가 트랜잭션과 상태 전이를 명확히 조정하는가?
        - domain 객체가 지켜야 할 불변식이 호출자 규칙이나 단순 setter에 흩어져 있지 않은가?
        - repository와 infrastructure 세부사항이 상위 계층의 정책을 불필요하게 오염시키지 않는가?
        - 계층은 나뉘어 있지만 책임이 중복되어 규칙 변경 시 여러 곳을 함께 수정해야 하지 않는가?
        - DTO, entity, domain model의 분리는 실질적인 책임 차이가 있을 때만 제안한다.

        추상화를 제안할 때는 변경 이유가 같은 코드가 모이는지, 의존 방향이 단순해지는지,
        테스트가 쉬워지는지 등 구체적인 이득을 설명한다. 미래에 쓸 수도 있다는 이유만으로
        인터페이스, 팩토리, 계층을 추가하도록 요구하지 않는다.

        ## 도메인 규칙과 상태 전이

        성공 경로뿐 아니라 허용되지 않는 상태와 중간 상태를 확인한다.

        - 생성, 진행, 성공, 실패, 만료, 삭제 같은 상태 전이가 유효한 순서로만 가능한가?
        - 객체 생성 시점과 영속화 이후 모두에서 필수 불변식이 유지되는가?
        - 같은 비즈니스 규칙이 여러 서비스나 컨트롤러에서 서로 다르게 구현되지 않는가?
        - null, 빈 값, 경계값, 최대 길이, 잘못된 UUID, 존재하지 않는 연관 데이터가 안전하게 처리되는가?
        - 부분 생성 데이터와 실패 상태가 이후 조회, 재시도, 정리 작업에서 올바르게 해석되는가?
        - 시간, 만료, 일자 계산이 서버 기본 타임존이나 현재 시각 호출 위치에 따라 달라지지 않는가?

        상태를 바꾸는 코드에서는 변경 전 조건, 변경 결과, 실패 시 남는 상태를 반드시 확인한다.

        ## 트랜잭션과 데이터 정합성

        여러 저장이나 외부 작업이 엮이면 원자성과 실패 경계를 중점적으로 검토한다.

        - 하나의 유스케이스에서 함께 성공해야 하는 DB 변경이 같은 트랜잭션으로 보호되는가?
        - 예외를 잡아 삼키거나 비동기/별도 빈 호출로 인해 의도치 않게 트랜잭션이 커밋되지 않는가?
        - self-invocation, 잘못된 전파 속성, readOnly 설정 때문에 @Transactional이 기대대로 동작하지 않는가?
        - DB 트랜잭션 안에서 느린 AI, 네트워크, S3 호출을 수행해 락과 커넥션을 오래 점유하지 않는가?
        - DB 커밋과 외부 저장소 작업 중 하나만 성공했을 때 고아 데이터나 유실이 남지 않는가?
        - 삭제 순서, cascade, orphanRemoval, FK 제약이 예상치 못한 연쇄 삭제나 실패를 만들지 않는가?
        - 조회 후 수정 사이에 데이터가 바뀌는 경쟁 조건과 lost update 가능성이 없는가?
        - DB 제약조건과 애플리케이션 검증이 함께 최종 정합성을 보장하는가?

        롤백만으로 복구되지 않는 외부 부수 효과가 있다면 보상, 재처리, 정리 작업이
        실제로 안전하게 동작하는지 확인한다.

        ## 동시성, 멱등성, 재시도

        동일 사용자 요청, 중복 전달, 여러 인스턴스, 스케줄러와 사용자 요청의 동시 실행을 가정한다.

        - check-then-act 로직이 DB의 원자적 연산이나 제약 없이 구현되지 않았는가?
        - 동일 idempotency key의 재요청이 같은 결과를 반환하고 다른 payload의 충돌을 구분하는가?
        - 사용량 제한, 토큰 회전, 생성 claim이 동시 요청에서도 초과 실행되거나 이중 소비되지 않는가?
        - 재시도가 동일 레코드, 이미지, 외부 요청을 중복 생성하지 않는가?
        - 락의 범위와 획득 순서가 교착, 장기 대기, 처리량 급감을 만들지 않는가?
        - 스케줄러가 다중 인스턴스에서 같은 작업을 중복 처리하지 않는가?
        - 실패한 작업을 다시 잡을 수 있으며 영원히 진행 중 상태로 고착되지 않는가?

        동시성 문제를 지적할 때는 최소 두 요청의 실행 순서를 예로 들어
        어떤 상태가 어떻게 깨지는지 설명한다.

        ## 인증, 인가, 입력 검증과 보안

        - 인증 여부뿐 아니라 요청한 사용자가 해당 일기, 공유 링크, 생성 결과의 소유자인지 검증하는가?
        - 사용자 식별자를 요청 본문이나 경로에서 신뢰해 다른 사용자의 데이터에 접근할 수 있지 않은가?
        - 액세스/리프레시 토큰의 발급, 검증, 회전, 폐기 과정에서 재사용이나 탈취 대응이 깨지지 않는가?
        - 쿠키의 Secure, HttpOnly, SameSite, Path, 만료 설정이 환경과 실제 인증 흐름에 맞는가?
        - CORS와 CSRF 설정이 필요한 origin과 method만 허용하며 우회 가능한 조합을 만들지 않는가?
        - 외부 입력과 외부 API 응답을 신뢰하기 전에 형식, 크기, 허용값을 검증하는가?
        - 로그, 예외 메시지, 응답, 설정에 토큰, 쿠키, 개인정보, 비밀키가 노출되지 않는가?
        - URL, object key, 파일명 같은 입력이 경로 조작이나 의도하지 않은 리소스 접근을 허용하지 않는가?

        보안 문제는 공격 전제, 진입점, 영향 범위를 구체적으로 설명한다.

        ## API 계약과 예외 처리

        - HTTP status, ProblemDetail/error code, 응답 body가 같은 실패 의미를 일관되게 표현하는가?
        - 도메인/애플리케이션 예외가 너무 넓은 catch에 의해 500이나 성공 응답으로 바뀌지 않는가?
        - 내부 구현 정보나 원인이 클라이언트 응답에 그대로 노출되지 않는가?
        - 같은 입력의 validation 규칙과 오류 형식이 엔드포인트마다 달라지지 않는가?
        - 응답 변경이 기존 클라이언트의 필드 존재 여부, nullable, enum 기대를 깨지 않는가?
        - 비동기 처리 API가 현재 상태와 재조회/재시도 방법을 명확히 제공하는가?
        - 예외 변환 과정에서 원인과 trace id가 사라져 운영 중 추적할 수 없게 되지 않는가?

        ## 영속성, 쿼리와 마이그레이션

        - 반복 조회와 지연 로딩으로 N+1, 과도한 쿼리, LazyInitializationException이 생기지 않는가?
        - 목록/타임라인 조회가 데이터 증가 후에도 페이지 크기, 정렬, 인덱스를 활용하는가?
        - offset/cursor와 정렬 기준이 중복 또는 누락 없이 안정적인가?
        - bulk update/delete 후 영속성 컨텍스트에 오래된 상태가 남지 않는가?
        - unique/FK/not-null/check 제약과 repository 반환 타입이 실제 데이터 규칙을 반영하는가?
        - migration이 기존 운영 데이터의 null, 중복, 실패 상태도 안전하게 처리하는가?
        - 큰 테이블 변경이 장시간 락이나 전체 테이블 재작성을 유발하지 않는가?
        - 이전/새 애플리케이션 버전이 잠시 공존해도 schema 호환성이 유지되는가?

        쿼리 성능 문제는 데이터 규모와 호출 빈도를 고려한다. 근거 없이 모든 연관관계에
        fetch join이나 인덱스를 추가하도록 요구하지 않는다.

        ## 외부 연동과 비동기 작업

        AI API, OAuth provider, S3 등 프로세스 밖의 시스템은 지연되거나 실패하고,
        성공 응답도 잘못된 데이터를 포함할 수 있다고 가정한다.

        - connect/read timeout과 취소 정책이 있어 요청 스레드가 무기한 점유되지 않는가?
        - 재시도 대상 오류와 즉시 실패할 오류를 구분하고 backoff와 최대 횟수가 있는가?
        - 외부 오류가 내부의 안정적인 예외와 상태 모델로 변환되는가?
        - 응답 schema, content type, 크기, 필수 필드를 검증한 뒤 저장하거나 반환하는가?
        - 이미지나 생성 결과 저장 실패 시 DB 상태와 외부 객체가 정리되거나 재처리 가능한가?
        - presigned/public URL의 만료와 접근 범위가 사용 시나리오에 맞는가?
        - executor의 queue, pool 크기, rejection, shutdown 정책이 부하 상황에서 안전한가?
        - 비동기 예외가 유실되지 않고 실패 상태 기록과 관측 가능한 로그로 이어지는가?

        ## 성능과 자원 관리

        - 요청마다 큰 byte array, 이미지, 전체 결과 집합을 메모리에 중복 적재하지 않는가?
        - stream, HTTP response, 파일, executor 등 닫아야 할 자원이 모든 경로에서 해제되는가?
        - 사용자 입력으로 반복 횟수, payload, 병렬 작업 수가 무제한 증가할 수 있지 않은가?
        - 락, DB 커넥션, 요청 스레드를 느린 작업 동안 불필요하게 점유하지 않는가?
        - 캐시 key, 만료, 무효화와 사용자 간 데이터 격리가 올바른가?

        작은 데이터에서만 의미 없는 미세 최적화는 제안하지 않는다. 실제 요청 빈도,
        데이터 크기, 자원 한도에서 장애나 뚜렷한 비용을 만드는 경우를 우선한다.

        ## 설정과 운영 관측성

        - 환경별 필수 설정이 누락되면 위험한 기본값으로 동작하지 않고 시작 시 검증되는가?
        - 비밀값과 운영 전용 값이 코드나 저장소에 하드코딩되지 않는가?
        - 장애 로그에 요청/작업 식별자와 원인은 남지만 민감정보는 제외되는가?
        - 같은 예외가 여러 계층에서 중복 로깅되어 신호를 흐리지 않는가?
        - 실패율, 지연, queue 적체, 재시도 소진처럼 조치 가능한 신호를 관측할 수 있는가?
        - cleanup과 batch 작업이 처리 건수, 실패 건수, 다음 재시도 가능 여부를 남기는가?

        로그 문구의 취향보다 장애 발생 시 원인과 영향 대상을 실제로 찾을 수 있는지를 검토한다.

        ## 유지보수성과 코드 품질

        - 한 메서드나 클래스가 서로 다른 변경 이유와 정책을 과도하게 떠안고 있지 않은가?
        - 중요한 규칙이 긴 조건문, boolean 조합, magic string/number에 숨겨져 있지 않은가?
        - 이름이 기술적 구현보다 비즈니스 의미, 상태 변화, 실패 조건을 드러내는가?
        - null/Optional/예외 반환 규약이 호출자마다 다르게 해석될 여지가 없는가?
        - 중복 제거가 오히려 서로 다른 정책을 억지로 결합하지 않는가?
        - 새 추상화가 호출 흐름과 오류 원인을 더 따라가기 어렵게 만들지 않는가?
        - 주석이 코드 동작을 반복하기보다 중요한 제약과 선택 이유를 설명하는가?

        리팩터링을 제안할 때는 현재 코드에서 어떤 변경이나 버그 예방이 쉬워지는지 설명한다.

        ## 테스트

        변경된 핵심 규칙과 가장 위험한 실패 시나리오가 테스트로 보호되는지 확인한다.

        - 정상 경로만 있고 권한 없음, 잘못된 입력, 외부 실패, 부분 실패 테스트가 빠지지 않았는가?
        - 트랜잭션 롤백과 커밋 후 상태를 실제 DB를 사용하는 테스트로 확인해야 하는가?
        - unique/FK, JPA mapping, query, migration처럼 mock으로 보장할 수 없는 동작을 통합 테스트하는가?
        - 동일 요청의 중복 실행과 경쟁 조건을 검증할 가치가 큰가?
        - 시간과 랜덤 값이 Clock/Generator 같은 제어 가능한 의존성 없이 테스트를 불안정하게 만들지 않는가?
        - 테스트가 구현 순서만 재현해 리팩터링에 취약하거나 핵심 결과를 검증하지 않는가?
        - 버그 수정이라면 해당 버그의 재현 조건을 고정하는 회귀 테스트가 있는가?

        모든 메서드에 테스트를 기계적으로 요구하지 않는다. 데이터 정합성, 보안, 상태 전이,
        실패 복구처럼 회귀 비용이 큰 동작을 우선한다.

        ## 리뷰 작성 방식

        명백한 문제라면 한 코멘트 안에 다음을 구체적으로 설명한다.

        1. 어떤 코드와 가정이 문제인지
        2. 어떤 입력이나 실행 순서에서 발생하는지
        3. 데이터, 사용자, 운영에 어떤 결과가 생기는지
        4. 가능한 최소 수정 방향이나 검증 방법

        설계 선택이라면 단정하기 전에 의도, 예상 트래픽, 배포 방식, 실패 허용 범위를 질문한다.
        이미 안전장치가 다른 계층에 있다면 중복 코멘트를 남기지 말고 전체 흐름을 확인한다.

