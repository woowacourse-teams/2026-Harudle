log_format harudle_latency escape=json
    '{"event":"proxy_request_completed","stage":"frontend_proxy",'
    '"timestamp":"$time_iso8601","proxyRequestId":"$request_id",'
    '"traceId":"$upstream_http_x_trace_id","method":"$request_method","uri":"$uri",'
    '"status":$status,"requestSeconds":$request_time,'
    '"upstreamConnectSeconds":"$upstream_connect_time",'
    '"upstreamHeaderSeconds":"$upstream_header_time",'
    '"upstreamResponseSeconds":"$upstream_response_time",'
    '"bodyBytesSent":$body_bytes_sent,"requestCompleted":"$request_completion"}';

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log harudle_latency;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 25m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(api|oauth2|login/oauth2|scalar|v3/api-docs)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location ^~ /profile-images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
