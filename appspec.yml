version: 0.0
os: linux

files:
  - source: deploy/compose.dev.yaml
    destination: /opt/harudle
  - source: deploy/compose.prod.yaml
    destination: /opt/harudle
  - source: deploy/compose.diary-reader.yaml
    destination: /opt/harudle
  - source: deploy/compose.diary-writer.yaml
    destination: /opt/harudle
  - source: deploy/diary-source-text-release-mode
    destination: /opt/harudle
  - source: deploy/monitoring
    destination: /opt/harudle/monitoring
  - source: build-artifacts
    destination: /opt/harudle/images
  - source: backend/src/main/resources/db/maintenance/backfill_user_public_profiles.sql
    destination: /opt/harudle/maintenance
  - source: deploy/scripts/run_profile_backfill.sh
    destination: /opt/harudle/maintenance
  - source: backend/load-test
    destination: /opt/harudle/load-test
  - source: backend/src/main/resources/load-test-diary.png
    destination: /opt/harudle/load-test

hooks:
  BeforeInstall:
    - location: deploy/scripts/before_install.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: deploy/scripts/after_install.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: deploy/scripts/application_start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: deploy/scripts/validate_service.sh
      timeout: 360
      runas: root
