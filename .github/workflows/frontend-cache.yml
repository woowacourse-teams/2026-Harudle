name: Frontend package cache

on:
  push:
    branches:
      - develop-frontend
    paths:
      - "frontend/**/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/.npmrc"
      - "frontend/.pnpmfile.cjs"
      - "frontend/patches/**"
      - ".github/workflows/frontend-cache.yml"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: frontend-package-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-cache:
    name: Frontend Package Cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies for shared cache
        run: pnpm install --frozen-lockfile
