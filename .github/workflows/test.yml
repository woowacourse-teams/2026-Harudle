name: Test

on:
  pull_request:
    branches:
      - dev
      - main
      - develop-backend
      - develop-frontend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  monitoring-config:
    name: Monitoring deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate environment separation
        run: |
          printf 'DEPLOY_ENV=dev\n' > deploy/.env
          trap 'rm -f deploy/.env' EXIT

          prod="$(docker compose -f deploy/compose.prod.yaml config --format json)"
          dev="$(docker compose -f deploy/compose.prod.yaml -f deploy/compose.dev.yaml config --format json)"
          jq -e '.services.backend.logging.options["awslogs-group"] == "/harudle/prod/backend"
            and .services.backend.environment.CONSOLE_LOG_STRUCTURED_FORMAT == "logstash"
            and .services.backend.logging.options["awslogs-multiline-pattern"] == null
            and .services.backend.ports[0].host_ip == "127.0.0.1"
            and .services.backend.ports[0].published == "19091"' <<<"${prod}"
          jq -e '.services.backend.logging.options["awslogs-group"] == "/harudle/dev/backend"
            and .services.frontend.logging.options["awslogs-group"] == "/harudle/dev/frontend-nginx"
            and .services.backend.logging.options["awslogs-create-group"] == "false"
            and .services.backend.ports[0].host_ip == "127.0.0.1"
            and .services.backend.ports[0].published == "19091"' <<<"${dev}"

          jq -e '.logs.metrics_collected.prometheus.emf_processor.metric_namespace == "Harudle/Dev"' \
            deploy/monitoring/cloudwatch-agent.dev.json
          jq -e '.logs.metrics_collected.prometheus.emf_processor.metric_namespace == "Harudle/Prod"' \
            deploy/monitoring/cloudwatch-agent.prod.json

          bash -c 'source deploy/scripts/compose_environment.sh; configure_compose "$PWD/deploy"; test "$DEPLOY_ENV_VALUE" = dev'
          printf 'DEPLOY_ENV=prod\n' > deploy/.env
          bash -c 'source deploy/scripts/compose_environment.sh; configure_compose "$PWD/deploy"; test "$DEPLOY_ENV_VALUE" = prod'
          printf '\n' > deploy/.env
          if bash -c 'source deploy/scripts/compose_environment.sh; configure_compose "$PWD/deploy"'; then
            echo 'DEPLOY_ENV must not default to prod.' >&2
            exit 1
          fi

  backend-test:
    name: Backend Test
    if: github.base_ref != 'develop-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DB_PASSWORD: test
      KAKAO_REST_API_KEY: test
      KAKAO_CLIENT_SECRET: test
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      HARUDLE_GENERATION_ADAPTERS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Verify Docker
        run: docker info

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          cwebp -version
          dwebp -version

      - name: Run backend tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

  frontend-test:
    name: Frontend Test
    if: github.base_ref != 'develop-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: |
          pnpm --dir web typecheck
          pnpm --dir web lint
          pnpm --dir web test --ci --runInBand
