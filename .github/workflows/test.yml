name: Test

on:
  push:
    branches:
      - develop-backend
    paths:
      - "backend/src/**"
      - "backend/*.gradle*"
      - "backend/gradle.properties"
      - "backend/gradle/**"
      - "backend/gradlew*"
      - ".github/workflows/test.yml"
  pull_request:
    branches:
      - dev
      - main
      - develop-backend
      - develop-frontend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  monitoring-config:
    name: Monitoring deployment config
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test Discord forwarder (offline)
        run: python3 -m unittest discover -s deploy/monitoring -p 'test_*.py'

      - name: Validate environment separation
        run: |
          trap 'rm -f deploy/.env' EXIT
          write_image_settings() {
            printf 'DEPLOY_ENV=%s\nS3_BUCKET=techcourse-project-2026\nS3_GENERATED_PREFIX=harudle/generated/diary-images/%s\nS3_REFERENCE_PREFIX=harudle/references/generation/%s\n' \
              "$1" "$1" "$1" > deploy/.env
          }
          write_image_settings dev

          prod="$(docker compose -f deploy/compose.prod.yaml config --format json)"
          dev="$(docker compose -f deploy/compose.prod.yaml -f deploy/compose.dev.yaml config --format json)"
          jq -e '.services.backend.logging.options["awslogs-group"] == "/harudle/prod/backend"
            and .services.backend.environment.CONSOLE_LOG_STRUCTURED_FORMAT == "logstash"
            and .services.backend.logging.options["awslogs-multiline-pattern"] == null
            and .services.backend.ports[0].host_ip == "127.0.0.1"
            and .services.backend.ports[0].published == "19091"' <<<"${prod}"
          jq -e '.services.backend.logging.options["awslogs-group"] == "/harudle/dev/backend"
            and .services.frontend.logging.options["awslogs-group"] == "/harudle/dev/frontend-nginx"
            and .services.backend.logging.options["awslogs-create-group"] == "false"
            and .services.backend.ports[0].host_ip == "127.0.0.1"
            and .services.backend.ports[0].published == "19091"' <<<"${dev}"

          jq -e '.logs.metrics_collected.prometheus.emf_processor.metric_namespace == "Harudle/Dev"' \
            deploy/monitoring/cloudwatch-agent.dev.json
          jq -e '.logs.metrics_collected.prometheus.emf_processor.metric_namespace == "Harudle/Prod"' \
            deploy/monitoring/cloudwatch-agent.prod.json
          for config in deploy/monitoring/cloudwatch-agent.dev.json deploy/monitoring/cloudwatch-agent.prod.json; do
            jq -e 'any(.logs.metrics_collected.prometheus.emf_processor.metric_declaration[];
              .metric_selectors == ["^http_server_requests_seconds_count$"]
              and any(.dimensions[]; . == ["job"])
              and any(.dimensions[]; . == ["job", "outcome"]))' "$config"
          done

          DEPLOYMENT_GROUP_NAME=harudle-dev bash -c 'source deploy/scripts/compose_environment.sh; configure_compose "$PWD/deploy"; test "$DEPLOY_ENV_VALUE" = dev'
          write_image_settings prod
          DEPLOYMENT_GROUP_NAME=harudle-prod bash -c 'source deploy/scripts/compose_environment.sh; configure_compose "$PWD/deploy"; test "$DEPLOY_ENV_VALUE" = prod'
          sed 's/^DEPLOY_ENV=.*/DEPLOY_ENV=/' deploy/.env > deploy/invalid.env
          mv deploy/invalid.env deploy/.env
          if DEPLOYMENT_GROUP_NAME=harudle-prod bash -c 'source deploy/scripts/compose_environment.sh; configure_compose "$PWD/deploy"' > /tmp/image-environment-error 2>&1; then
            echo 'DEPLOY_ENV must not default to prod.' >&2
            exit 1
          fi
          grep -Fq 'Image environment mismatch: DEPLOY_ENV.' /tmp/image-environment-error

  backend-test:
    name: ${{ github.event_name == 'push' && 'Backend Compile Cache' || 'Backend Test' }}
    if: github.base_ref != 'develop-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DB_PASSWORD: test
      KAKAO_REST_API_KEY: test
      KAKAO_CLIENT_SECRET: test
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      HARUDLE_GENERATION_ADAPTERS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Verify Docker
        if: github.event_name != 'push'
        run: docker info

      - name: Test CodeBuild backend cache (offline)
        if: github.event_name != 'push'
        run: bash ../deploy/scripts/test_codebuild_backend.sh

      - name: Test deployment image environment
        if: github.event_name != 'push'
        run: |
          bash ../deploy/scripts/test_image_environment.sh
          bash ../deploy/scripts/test_backend_entrypoint.sh
          bash ../deploy/scripts/test_image_recovery.sh

      - name: Install WebP tools
        if: github.event_name != 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          cwebp -version
          dwebp -version

      - name: Compile backend for shared cache
        if: github.event_name == 'push'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --build-cache classes testClasses

      - name: Run backend and maintenance tests
        if: github.event_name != 'push'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --build-cache \
            --init-script ../deploy/scripts/ci_test_progress.gradle \
            test --rerun maintenanceTest --rerun \
            -PtestMaxParallelForks=2

      - name: Save backend test diagnostics
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-diagnostics-${{ github.run_attempt }}
          path: |
            backend/build/test-results/test/
            backend/build/test-results/maintenanceTest/
            backend/build/reports/tests/test/
            backend/build/reports/tests/maintenanceTest/
          retention-days: 3
          if-no-files-found: warn

  # 일기 원문 암호화 배포 검사는 일반 백엔드 테스트와 의존 관계가 없으므로 별도 러너에서 동시에 실행한다.
  backend-crypto-checks:
    name: Backend Crypto Checks
    if: github.event_name != 'push' && github.base_ref != 'develop-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DB_PASSWORD: test
      KAKAO_REST_API_KEY: test
      KAKAO_CLIENT_SECRET: test
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      HARUDLE_GENERATION_ADAPTERS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      # Backend Test Job이 캐시를 저장하므로 이 Job은 같은 캐시를 읽기만 한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Verify Docker
        run: docker info

      - name: Test diary key preflight and release selection (offline)
        run: |
          bash ../deploy/scripts/test_diary_key_verification.sh
          bash ../deploy/scripts/test_diary_release.sh
          bash ../deploy/scripts/test_diary_writer_approval.sh
          bash ../deploy/scripts/test_diary_source_text_backfill.sh

      - name: Test encrypted load-test fixtures and PostgreSQL recovery
        env:
          LOAD_TEST_POSTGRES_TEST: "1"
        run: python3 -m unittest discover -s load-test -p 'test_*.py'

      - name: Verify packaged key checks, initialization and migration
        run: |
          chmod +x gradlew
          server_tasks="$(./gradlew --no-daemon --console=plain build --dry-run)"
          if grep -Eq '^:compileMaintenance|^:maintenance(Class|Jar|Test)' <<<"$server_tasks"; then
            echo 'Normal server packaging must not build maintenance sources.' >&2
            exit 1
          fi
          ./gradlew --no-daemon --console=plain --build-cache bootJar maintenanceJar
          jar --list --file build/libs/harudle-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/harudle-server-classes.txt"
          grep -Fxq 'BOOT-INF/classes/com/harudle/recovery/ImageRecoveryApplication.class' "$RUNNER_TEMP/harudle-server-classes.txt"
          bash ../deploy/scripts/test_diary_key_check_jar.sh build/libs/harudle-0.0.1-SNAPSHOT.jar
          bash ../deploy/scripts/test_diary_key_initialization_jar.sh build/libs/harudle-0.0.1-SNAPSHOT.jar
          bash ../deploy/scripts/test_diary_source_text_backfill_jar.sh build/libs/harudle-0.0.1-SNAPSHOT.jar build/maintenance/harudle-diary-source-maintenance.jar

      - name: Record maintenance artifact identity
        env:
          MAINTENANCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD > build/maintenance/commit.txt
          printf '%s\n' "$MAINTENANCE_COMMIT" > build/maintenance/head-commit.txt
          (cd build/maintenance && sha256sum harudle-diary-source-maintenance.jar > checksums.sha256)

      - name: Upload verified maintenance JAR
        uses: actions/upload-artifact@v7
        with:
          name: diary-source-maintenance-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            backend/build/maintenance/harudle-diary-source-maintenance.jar
            backend/build/maintenance/commit.txt
            backend/build/maintenance/head-commit.txt
            backend/build/maintenance/checksums.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  frontend-test:
    name: Frontend Test
    if: github.event_name != 'push' && github.base_ref != 'develop-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: pnpm --dir web check
